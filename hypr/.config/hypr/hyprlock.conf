# =============================================================================
# HYPRLOCK - Catppuccin Macchiato + Laranja (#fc7b53)
# =============================================================================

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
    no_fade_in = false
}

# -----------------------------------------------------
# BACKGROUND (Wallpaper com Blur suave ou Fallback escuro)
# -----------------------------------------------------
background {
    monitor =
    path = /home/brizotti/wallpaper/default.jpg
    color = rgba(36, 39, 58, 1.0) # Fallback Base Catppuccin
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.80
    vibrancy = 0.20
}

# -----------------------------------------------------
# HORA (Grande em Destaque Laranja)
# -----------------------------------------------------
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(252, 123, 83, 1.0) # Laranja #fc7b53
    font_size = 96
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 140
    halign = center
    valign = center
}

# -----------------------------------------------------
# DATA (Subtexto suave)
# -----------------------------------------------------
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d de %B")"
    color = rgba(202, 211, 245, 0.85) # #cad3f5
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 60
    halign = center
    valign = center
    shadow_passes = 1
}

# -----------------------------------------------------
# SAUDAÇÃO / USUÁRIO
# -----------------------------------------------------
label {
    monitor =
    text =   $USER
    color = rgba(238, 212, 159, 0.9) # Amarelo #eed49f
    font_size = 15
    font_family = JetBrainsMono Nerd Font SemiBold
    position = 0, -20
    halign = center
    valign = center
}

# -----------------------------------------------------
# CAMPO DE SENHA (INPUT)
# -----------------------------------------------------
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    dots_rounding = -1

    # Cores
    outer_color = rgba(252, 123, 83, 1.0)        # Borda Laranja
    inner_color = rgba(30, 32, 48, 0.90)         # Mantle Escuro
    font_color = rgba(202, 211, 245, 1.0)        # Texto Claro
    check_color = rgba(238, 212, 159, 1.0)       # Amarelo durante verificação
    fail_color = rgba(237, 135, 150, 1.0)        # Vermelho em erro

    fade_on_empty = false
    placeholder_text = <span foreground="##a5adcb"><i>Senha de acesso...</i></span>
    fail_text = <i>Senha incorreta (<b>$ATTEMPTS</b>)</i>
    fail_transition = 200

    hide_input = false
    rounding = 12

    position = 0, -90
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
}

# -----------------------------------------------------
# AVISO DE CAPS LOCK
# -----------------------------------------------------
label {
    monitor =
    text = cmd[update:250] echo "$(hyprctl getoption input:kb_layout -j | grep -q 'locked.*true' && echo '󰪛 CAPS LOCK ATIVADO')"
    color = rgba(237, 135, 150, 1.0)
    font_size = 11
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, -150
    halign = center
    valign = center
}