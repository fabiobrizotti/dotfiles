# =============================================================================
# PALETA DE CORES (Catppuccin Macchiato + Laranja / Pêssego)
# =============================================================================
# Fundo e Texto principal
foreground              #cad3f5
background              #24273a
selection_foreground    #24273a
selection_background    #fc7b53

# Cursor
cursor                  #fc7b53
cursor_text_color       #24273a

# URLs e sublinhados
url_color               #fc7b53
url_style               curly

# Barra de abas (Tabs)
active_tab_foreground   #24273a
active_tab_background   #fc7b53
inactive_tab_foreground #cad3f5
inactive_tab_background #1e2030
tab_bar_style           powerline
tab_powerline_style     slanted

# =============================================================================
# JANELA / CONFORTO (alinhado às bordas arredondadas do Hyprland)
# =============================================================================
# Padding interno para dar respiro ao texto (combina com o tema limpo)
window_padding_width    12

# Opacidade de fundo (dá o efeito translúcido do setup, sem blur externo)
background_opacity      0.85
foreground_opacity      1.0

# Esconde decorações próprias (o Hyprland gerencia bordas/arredondamento)
hide_window_decorations  titlebar-only

# Cores do Terminal
# Preto / Cinzento escuro
color0  #494d64
color8  #5b6078
# Vermelho
color1  #ed8796
color9  #ed8796
# Verde
color2  #a6da95
color10 #a6da95
# Amarelo
color3  #eed49f
color11 #eed49f
# Azul substituído por Laranja / Âmbar (Pastas e caminhos no shell)
color4  #fc7b53
color12 #f5a97f
# Magenta / Pêssego
color5  #f5a97f
color13 #fc7b53
# Ciano / Amarelo suave
color6  #eed49f
color14 #eed49f
# Branco / Texto claro
color7  #b8c0e0
color15 #cad3f5