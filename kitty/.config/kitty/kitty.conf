# =============================================================================
# TIPOGRAFIA & FONTES
# =============================================================================
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size        12.0

# Otimizações de renderização
disable_ligatures never
box_drawing_scale 0.001, 1, 1.5, 2

# =============================================================================
# APARÊNCIA & TRANSPARÊNCIA
# =============================================================================
background_opacity 0.85
dynamic_background_opacity yes

# Margens internas (respiro visual)
window_padding_width 12
placement_strategy center
hide_window_decorations yes
confirm_os_window_close 0

# =============================================================================
# CURSOR & SCROLLBACK
# =============================================================================
cursor_shape beam
cursor_beam_thickness 1.5
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0
scrollback_lines 5000
mouse_hide_wait 3.0

# =============================================================================
# PALETA DE CORES (Catppuccin Macchiato + Laranja)
# =============================================================================
# Fundo e Texto principal
foreground              #cad3f5
background              #24273a
selection_foreground    #24273a
selection_background    #fc7b53

# Cursor
cursor                  #fc7b53
cursor_text_color       #24273a

# URLs e sublinhados
url_color               #fc7b53
url_style               curly

# Barra de abas (Tabs)
active_tab_foreground   #24273a
active_tab_background   #fc7b53
inactive_tab_foreground #cad3f5
inactive_tab_background #1e2030
tab_bar_style           powerline
tab_powerline_style     slanted

# Cores Normais do Terminal
# Preto / Cinzento escuro
color0  #494d64
color8  #5b6078
# Vermelho
color1  #ed8796
color9  #ed8796
# Verde
color2  #a6da95
color10 #a6da95
# Amarelo
color3  #eed49f
color11 #eed49f
# Azul
color4  #8aadf4
color12 #8aadf4
# Magenta / Laranja (Destaque)
color5  #fc7b53
color13 #f5a97f
# Ciano / Teal
color6  #8bd5ca
color14 #91d7e3
# Branco / Texto claro
color7  #b8c0e0
color15 #cad3f5

# =============================================================================
# ATALHOS ÚTEIS
# =============================================================================
# Gestão de Abas
map ctrl+shift+t new_tab
map ctrl+shift+w close_tab
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab

# Ajuste rápido do tamanho do texto
map ctrl+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+backspace change_font_size all 0

# Recarregar configuração em tempo real
map ctrl+shift+f5 load_config_file
