# Drop-in do systemd para o thermald.service
# Instalar em: /etc/systemd/system/thermald.service.d/override.conf
#
# Razao: o arquivo de unit original do pacote usa `--adaptive`, que (segundo o
# man thermald.8) "usa tabelas DPTF adaptativas quando presentes e IGNORA
# os arquivos de config via xml". Mesmo sem devices DPTF neste laptop, o modo
# adaptive nao aplicava o nosso /etc/thermald/thermal-conf.xml (validado
# empiricamente: o poll so avaliava o trip de maior temperatura e nao agia em
# 80C). A troca para --ignore-default-control faz o thermald seguir
# estritamente o thermal-conf.xml custom.
#
# Instalacao:
#   sudo mkdir -p /etc/systemd/system/thermald.service.d
#   sudo cp setup/thermald-systemd-dropin.conf \
#             /etc/systemd/system/thermald.service.d/override.conf
#   sudo systemctl daemon-reload && sudo systemctl restart thermald
[Service]
ExecStart=
ExecStart=/usr/bin/thermald --systemd --dbus-enable --ignore-default-control
